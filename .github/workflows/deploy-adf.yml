name: Deploy ADF Environments

on:
  push:
    branches:
      - adf_publish  # Runs automatically when you click "Publish" in the ADF UI

permissions:
  id-token: write    # Required for OIDC Azure Login
  contents: read

jobs:
  # ==========================================
  # 1. QA DEPLOYMENT STAGE
  # ==========================================
  deploy-qa:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy ARM Template to QA
      uses: azure/arm-deploy@v2
      with:
        resourceGroupName: 'rg-qa'
        template: './adf-dev-trial/ARMTemplateForFactory.json'
        parameters: './adf-dev-trial/ARMTemplateParametersForFactory.json'
        overrideParameters: >
          -factoryName "adf-qa-trial"
          -LS_AzureKeyVault_properties_typeProperties_baseUrl "https://azure.net"

  # ==========================================
  # 2. UAT DEPLOYMENT STAGE
  # ==========================================
  deploy-uat:
    runs-on: ubuntu-latest
    needs: deploy-qa  # Ensures UAT waits until QA finishes successfully
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy ARM Template to UAT
      uses: azure/arm-deploy@v2
      with:
        resourceGroupName: 'rg-uat'
        template: './adf-dev-trial/ARMTemplateForFactory.json'
        parameters: './adf-dev-trial/ARMTemplateParametersForFactory.json'
        overrideParameters: >
          -factoryName "adf-uat-trial"
          -LS_AzureKeyVault_properties_typeProperties_baseUrl "https://azure.net"

  # ==========================================
  # 3. PROD DEPLOYMENT STAGE
  # ==========================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-uat  # Ensures Prod waits until UAT finishes successfully
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy ARM Template to PROD
      uses: azure/arm-deploy@v2
      with:
        resourceGroupName: 'rg-prod'
        template: './adf-dev-trial/ARMTemplateForFactory.json'
        parameters: './adf-dev-trial/ARMTemplateParametersForFactory.json'
        overrideParameters: >
          -factoryName "adf-prod-trial"
          -LS_AzureKeyVault_properties_typeProperties_baseUrl "https://azure.net"
